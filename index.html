<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Συλλογή Εφαρμογών</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1b1b;
    --paper: #fdfaf1;
    --paper-line: rgba(80, 140, 200, 0.18);
    --red: #e4572e;
    --blue: #2e86ab;
    --yellow: #ffd23f;
    --green: #4c956c;
    --radius-sketch: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Patrick Hand", "Comic Sans MS", cursive;
    color: var(--ink);
    min-height: 100vh;
    padding: 44px 22px 70px;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 27px, var(--paper-line) 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, var(--paper-line) 27px 28px),
      radial-gradient(circle at 12% 8%, rgba(255, 210, 63, 0.22), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(46, 134, 171, 0.16), transparent 50%);
  }

  header {
    max-width: 1180px;
    margin: 0 auto 46px;
    text-align: center;
    position: relative;
  }

  header h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(1.15rem, 3.6vw, 2.3rem);
    line-height: 1.5;
    color: var(--ink);
    text-shadow: 4px 4px 0 var(--yellow), 7px 7px 0 rgba(0,0,0,0.15);
    letter-spacing: 1px;
    display: inline-block;
    transform: rotate(-1deg);
    padding-bottom: 14px;
  }

  header h1::after {
    content: "";
    position: absolute;
    left: 8%; right: 8%; bottom: 0;
    height: 10px;
    background:
      radial-gradient(circle, var(--red) 45%, transparent 47%) 0 0 / 16px 10px repeat-x;
    opacity: .85;
  }

  header p {
    margin-top: 22px;
    font-family: "Caveat", cursive;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 700;
    color: #444;
    transform: rotate(.6deg);
  }

  .doodle {
    position: absolute;
    font-size: 1.6rem;
    color: var(--blue);
    transform: rotate(-14deg);
    user-select: none;
  }
  .doodle.left  { left: 2%; top: -14px; }
  .doodle.right { right: 2%; top: 6px; color: var(--red); transform: rotate(12deg); }

  .grid {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 38px 32px;
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: var(--radius-sketch);
    box-shadow: 7px 7px 0 var(--ink);
    transition: transform .2s ease, box-shadow .2s ease;
    isolation: isolate;
  }

  .tile:nth-child(odd)  { transform: rotate(-1.4deg); }
  .tile:nth-child(even) { transform: rotate(1.1deg); }
  .tile:nth-child(3n)   { transform: rotate(.5deg) translateY(6px); }

  .tile:hover, .tile:focus-visible {
    transform: rotate(0deg) translateY(-7px) scale(1.03);
    box-shadow: 12px 12px 0 var(--red);
    outline: none;
    z-index: 3;
  }

  .tile::before {
    content: "";
    position: absolute;
    top: -14px; left: 50%;
    width: 92px; height: 26px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(255, 210, 63, 0.75);
    border-left: 2px dashed rgba(0,0,0,.25);
    border-right: 2px dashed rgba(0,0,0,.25);
    z-index: 4;
  }

  .tile .art {
    position: relative;
    flex: 1;
    margin: 16px 16px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(58px, 11vw, 86px);
    background: var(--tile-bg, #cfe8ff);
    border: 3px dashed var(--ink);
    border-radius: 18px 60px 22px 55px / 55px 22px 60px 18px;
    overflow: hidden;
  }

  .tile .art::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.22) 1.4px, transparent 1.5px);
    background-size: 9px 9px;
    opacity: .55;
    pointer-events: none;
  }

  .tile .art span {
    position: relative;
    z-index: 1;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.3));
    transition: transform .25s ease;
  }

  .tile:hover .art span { transform: scale(1.14) rotate(-8deg); }

  .tile .info {
    position: relative;
    padding: 14px 18px 20px;
    background: #fff;
    z-index: 2;
  }

  .tile .info h2 {
    font-family: "Caveat", cursive;
    font-size: 1.55rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
  }

  .tile .info p {
    margin-top: 3px;
    font-family: "Patrick Hand", cursive;
    font-size: 1rem;
    color: #6b6b6b;
  }

  .tile .arrow {
    position: absolute;
    bottom: 14px; right: 16px;
    z-index: 3;
    font-family: "Press Start 2P", monospace;
    font-size: .8rem;
    padding: 7px 8px;
    background: var(--yellow);
    border: 2.5px solid var(--ink);
    border-radius: 40% 60% 55% 45%;
    box-shadow: 3px 3px 0 var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: .2s ease;
  }

  .tile:hover .arrow, .tile:focus-visible .arrow {
    opacity: 1;
    transform: translateY(0);
  }

  #cat {
    position: fixed;
    left: 0; top: 0;
    z-index: 50;
    pointer-events: none;
    will-change: transform;
  }

  #cat .cat-svg {
    display: block;
    overflow: visible;
  }

  #cat.flip .cat-svg { transform: scaleX(-1); }

  #cat .cat-tail {
    transform-origin: 14px 26px;
    animation: tail-sway 1.8s ease-in-out infinite;
  }

  #cat.walking .cat-tail { animation-duration: .6s; }

  #cat .cat-legs line {
    transform-box: fill-box;
    transform-origin: top center;
  }

  #cat.walking .leg-front { animation: leg-swing .3s ease-in-out infinite alternate; }
  #cat.walking .leg-back  { animation: leg-swing .3s ease-in-out infinite alternate-reverse; }
  #cat.jumping .cat-legs { transform: translateY(-2px) rotate(-8deg); transform-origin: 24px 28px; }
  #cat.jumping .cat-tail { animation-play-state: paused; transform: rotate(-25deg); }

  #cat.landing .cat-svg { animation: cat-squash .28s ease; }

  #cat .cat-bubble {
    position: absolute;
    left: 70%;
    bottom: 95%;
    white-space: nowrap;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--ink);
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 40% 60% 55% 45%;
    padding: 2px 10px 4px;
    box-shadow: 3px 3px 0 rgba(0,0,0,.2);
    opacity: 0;
    transform: translateY(4px) rotate(-2deg) scale(.85);
    transition: opacity .18s ease, transform .18s ease;
  }

  #cat .cat-bubble::after {
    content: "";
    position: absolute;
    left: 12px; bottom: -9px;
    width: 10px; height: 10px;
    background: #fff;
    border-right: 2.5px solid var(--ink);
    border-bottom: 2.5px solid var(--ink);
    transform: rotate(45deg);
  }

  #cat.meow .cat-bubble {
    opacity: 1;
    transform: translateY(0) rotate(-2deg) scale(1);
  }

  @keyframes tail-sway {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(18deg); }
  }

  @keyframes leg-swing {
    from { transform: rotate(-18deg); }
    to   { transform: rotate(18deg); }
  }

  @keyframes cat-squash {
    0%   { transform: scaleY(1) scaleX(1); }
    40%  { transform: scaleY(.78) scaleX(1.15); }
    100% { transform: scaleY(1) scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    #cat .cat-tail,
    #cat.walking .leg-front,
    #cat.walking .leg-back { animation: none; }
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 30px 20px; }
    body { padding: 30px 14px 50px; }
    .tile .info h2 { font-size: 1.2rem; }
    .tile .info p { display: none; }
    .doodle { display: none; }
  }
</style>
</head>
<body>

<header>
  <span class="doodle left">✏️</span>
  <span class="doodle right">★</span>
  <h1>ΣΥΛΛΟΓΗ<br>ΕΦΑΡΜΟΓΩΝ</h1>
</header>

<main class="grid" id="apps"></main>

<div id="cat" aria-hidden="true" hidden>
  <span class="cat-bubble">μιαυ!</span>
  <svg class="cat-svg" width="46" height="40" viewBox="0 0 48 40" xmlns="http://www.w3.org/2000/svg">
    <g class="cat-tail" fill="none" stroke="#1b1b1b" stroke-width="3.5" stroke-linecap="round">
      <path d="M14 26 C6 27 3 17 7 10" />
    </g>
    <g class="cat-legs" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round">
      <line class="leg leg-back"  x1="15" y1="28" x2="13" y2="37" />
      <line class="leg leg-front" x1="31" y1="28" x2="33" y2="37" />
    </g>
    <ellipse cx="24" cy="24" rx="14" ry="9" fill="#fff" stroke="#1b1b1b" stroke-width="3" />
    <path d="M32 10 L31 3 L37 8" fill="#fff" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M39 7 L43 2 L44 10" fill="#fff" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="38" cy="15" r="8" fill="#fff" stroke="#1b1b1b" stroke-width="3" />
    <circle cx="40" cy="14" r="1.6" fill="#1b1b1b" />
    <path d="M43 17 q2.5 1.5 4 0" fill="none" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M44 14.5 h5 M44 17 h5.5" stroke="#1b1b1b" stroke-width="1.2" stroke-linecap="round" />
  </svg>
</div>



<script>
  /* ============================================================
     ΠΡΟΣΘΕΣΕ ΕΔΩ ΤΙΣ ΕΦΑΡΜΟΓΕΣ ΣΟΥ
     - title  : όνομα εφαρμογής
     - desc   : σύντομη περιγραφή
     - url    : το link της εφαρμογής
     - icon   : emoji ή σύμβολο της εφαρμογής
     - color  : χρώμα του "σκετς" τετραγώνου
     ============================================================ */
  const APPS = [
    { title: "Ryanair Flight Planner", desc: "Ο σχεδιασμός των ταξιδιών αλλιώς!", url: "https://djgortsilas-lgtm.github.io/RyanairFlightPlanner", icon: "✈️", color: "#bde0fe" },
    { title: "Thess Cinema", desc: "Προβολές ταινιών στην Θεσσαλονίη", url: "https://djgortsilas-lgtm.github.io/ThessCinema", icon: "🎬", color: "#ffcad4" },
    { title: "Travel Cost", desc: "Υπολογισμός κόστους οδικών ταξιδιών", url: "https://djgortsilas-lgtm.github.io/travelcost/", icon: "🚗", color: "#c7f0d8" },
    { title: "Good News", desc: "Καλές ειδήσεις από όλο τον κόσμο", url: "https://djgortsilas-lgtm.github.io/goodnews", icon: "🌍", color: "#ffd6a5" }
  ];

  const root = document.getElementById("apps");

  APPS.forEach(app => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = app.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `
      <div class="art" style="--tile-bg:${app.color}"><span>${app.icon}</span></div>
      <div class="info">
        <h2>${app.title}</h2>
        <p>${app.desc || ""}</p>
      </div>
      <div class="arrow">GO ↗</div>`;
    root.appendChild(a);
  });

  /* ------------------------------------------------------------
     Η ΓΑΤΑΣ: τριγυρνάει πάνω από τα tiles και πηδάει από
     "παράθυρο" σε "παράθυρο"
     ------------------------------------------------------------ */
  (function catWander() {
    const cat = document.getElementById("cat");
    const bubble = cat.querySelector(".cat-bubble");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const CAT_W = 46, CAT_H = 40;
    let tiles = [];
    let current = null;
    let x = 0, y = 0;
    let facing = 1;
    let busy = false;

    const rand = (a, b) => a + Math.random() * (b - a);
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function collect() {
      tiles = [...document.querySelectorAll(".tile")].map(el => {
        const r = el.getBoundingClientRect();
        return { el, left: r.left, right: r.right, top: r.top, width: r.width };
      });
    }

    function place(px, py) {
      x = px; y = py;
      cat.style.transform = `translate(${px - CAT_W / 2}px, ${py - CAT_H}px)`;
    }

    function face(dir) {
      facing = dir;
      cat.classList.toggle("flip", dir < 0);
    }

    function meow() {
      bubble.textContent = Math.random() < 0.5 ? "μιαυ!" : "νιάου~";
      cat.classList.add("meow");
      setTimeout(() => cat.classList.remove("meow"), 1400);
    }

    function spotOn(tile) {
      const pad = 18;
      const inner = Math.max(1, tile.width - CAT_W - pad * 2);
      return tile.left + pad + rand(0, inner);
    }

    async function stroll(tile) {
      const tx = spotOn(tile);
      if (Math.abs(tx - x) < 6) return;
      face(tx > x ? 1 : -1);
      const x1 = x, dur = Math.min(1400, 400 + Math.abs(tx - x1) * 2.2);
      cat.classList.add("walking");
      const t0 = performance.now();
      await new Promise(res => {
        (function frame(t) {
          const p = Math.min(1, (t - t0) / dur);
          const nx = x1 + (tx - x1) * p;
          place(nx, y - Math.abs(Math.sin(p * Math.PI * 6)) * 2.5);
          if (p < 1) requestAnimationFrame(frame);
          else { place(tx, y); res(); }
        })(performance.now());
      });
      cat.classList.remove("walking");
    }

    async function jump(target) {
      const tx = spotOn(target), ty = target.top;
      const x1 = x, y1 = y;
      const dist = Math.hypot(tx - x1, ty - y1);
      const apex = Math.min(85, 34 + dist * 0.18);
      const dur = Math.min(950, 380 + dist * 0.5);
      face(tx >= x1 ? 1 : -1);
      cat.classList.add("jumping");
      const t0 = performance.now();
      await new Promise(res => {
        (function frame(t) {
          const p = Math.min(1, (t - t0) / dur);
          const nx = x1 + (tx - x1) * p;
          const ny = y1 + (ty - y1) * p - apex * 4 * p * (1 - p);
          place(nx, ny);
          if (p < 1) requestAnimationFrame(frame);
          else { place(tx, ty); res(); }
        })(performance.now());
      });
      cat.classList.remove("jumping");
      cat.classList.add("landing");
      setTimeout(() => cat.classList.remove("landing"), 300);
      if (Math.random() < 0.55) meow();
    }

    function nearest() {
      if (!tiles.length) return null;
      let best = null, bd = Infinity;
      for (const t of tiles) {
        const d = Math.abs((t.left + t.right) / 2 - x) + Math.abs(t.top - y) * 2;
        if (d < bd) { bd = d; best = t; }
      }
      return best;
    }

    async function wander() {
      while (true) {
        collect();
        if (!tiles.length) { await sleep(800); continue; }

        const from = tiles.includes(current) ? current : (current = nearest());
        await stroll(from);
        if (Math.random() < 0.35) { await sleep(rand(700, 1800)); }

        collect();
        const others = tiles.filter(t => t !== from);
        if (others.length) {
          const target = others.reduce((a, b) => {
            const da = Math.abs((a.left + a.right) / 2 - x);
            const db = Math.abs((b.left + b.right) / 2 - x);
            return Math.random() < db / (da + db + 1e-6) ? b : a;
          });
          await jump(target);
          current = target;
        }
        await sleep(rand(900, 2600));
      }
    }

    function rehome() {
      collect();
      const t = tiles.includes(current) ? current : (current = nearest());
      if (t) place(spotOn(t), t.top);
    }

    function start() {
      collect();
      if (!tiles.length) { setTimeout(start, 300); return; }
      current = tiles[Math.floor(Math.random() * tiles.length)];
      cat.hidden = false;
      place(spotOn(current), current.top);
      if (reduced) return;
      wander();
      let raf = 0;
      const onMove = () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          if (busy || cat.classList.contains("walking") || cat.classList.contains("jumping")) return;
          rehome();
        });
      };
      window.addEventListener("resize", onMove);
      window.addEventListener("scroll", onMove, { passive: true });
    }

    window.addEventListener("load", () => setTimeout(start, 400));
  })();

</script>

</body>
</html>
