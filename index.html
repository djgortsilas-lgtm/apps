<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Συλλογή Εφαρμογών</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1b1b;
    --paper: #fdfaf1;
    --paper-line: rgba(80, 140, 200, 0.18);
    --red: #e4572e;
    --blue: #2e86ab;
    --yellow: #ffd23f;
    --green: #4c956c;
    --radius-sketch: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Patrick Hand", "Comic Sans MS", cursive;
    color: var(--ink);
    min-height: 100vh;
    padding: 44px 22px 70px;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 27px, var(--paper-line) 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, var(--paper-line) 27px 28px),
      radial-gradient(circle at 12% 8%, rgba(255, 210, 63, 0.22), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(46, 134, 171, 0.16), transparent 50%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    background: radial-gradient(125% 120% at 50% 0%, transparent 62%, rgba(27,27,27,.05));
  }

  header {
    max-width: 1180px;
    margin: 0 auto 46px;
    text-align: center;
    position: relative;
  }

  header h1 {
    position: relative;
    font-family: "Press Start 2P", monospace;
    font-size: clamp(1.15rem, 3.6vw, 2.3rem);
    line-height: 1.5;
    color: var(--ink);
    text-shadow: 4px 4px 0 var(--yellow), 7px 7px 0 rgba(0,0,0,0.15);
    letter-spacing: 1px;
    display: inline-block;
    transform: rotate(-1deg);
    padding-bottom: 16px;
  }

  header h1::before {
    content: "";
    position: absolute;
    left: -5%; right: -5%;
    top: 8%; bottom: 30%;
    background: rgba(255, 210, 63, .3);
    border-radius: 42% 8% 36% 12% / 58% 26% 52% 40%;
    transform: rotate(-1.1deg);
    z-index: -1;
  }

  header h1::after {
    content: "";
    position: absolute;
    left: 8%; right: 8%; bottom: 0;
    height: 10px;
    background:
      radial-gradient(circle, var(--red) 45%, transparent 47%) 0 0 / 16px 10px repeat-x;
    opacity: .85;
  }

  header p {
    margin-top: 22px;
    font-family: "Caveat", cursive;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 700;
    color: #444;
    transform: rotate(.6deg);
  }

  .grid {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 280px));
    justify-content: center;
    gap: 38px 32px;
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: var(--radius-sketch);
    box-shadow: 7px 7px 0 var(--ink), 13px 13px 0 rgba(27,27,27,.12);
    transition: transform .2s ease, box-shadow .2s ease;
    isolation: isolate;
  }

  .tile:nth-child(odd)  { transform: rotate(-1.4deg); }
  .tile:nth-child(even) { transform: rotate(1.1deg); }
  .tile:nth-child(3n)   { transform: rotate(.5deg) translateY(6px); }

  .tile:hover, .tile:focus-visible {
    transform: rotate(0deg) translateY(-7px) scale(1.03);
    box-shadow: 12px 12px 0 var(--red), 19px 19px 0 rgba(228,87,46,.18);
    outline: none;
    z-index: 3;
  }

  .tile::before {
    content: "";
    position: absolute;
    top: -14px; left: 50%;
    width: 92px; height: 26px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(255, 210, 63, 0.75);
    border-left: 2px dashed rgba(0,0,0,.25);
    border-right: 2px dashed rgba(0,0,0,.25);
    z-index: 4;
  }

  .tile .art {
    position: relative;
    flex: 1;
    margin: 16px 16px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(58px, 11vw, 86px);
    background:
      radial-gradient(120% 95% at 28% 8%, rgba(255,255,255,.75), transparent 58%),
      var(--tile-bg, #cfe8ff);
    border: 3px dashed var(--ink);
    border-radius: 18px 60px 22px 55px / 55px 22px 60px 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 -12px 20px rgba(0,0,0,.06);
    overflow: hidden;
    transition: transform .25s ease;
  }

  .tile .art::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.22) 1.4px, transparent 1.5px);
    background-size: 9px 9px;
    opacity: .55;
    pointer-events: none;
  }

  .tile .art span {
    position: relative;
    z-index: 1;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.3));
    animation: icon-bob 2.4s ease-in-out infinite;
  }

  .tile:nth-child(1) .art span { animation: icon-fly 3s ease-in-out infinite; }
  .tile:nth-child(2) .art span { animation: icon-wobble 1.7s ease-in-out infinite; }
  .tile:nth-child(3) .art span { animation: icon-roll 5s ease-in-out infinite; }
  .tile:nth-child(n+4) .art span { animation: icon-bob 2.4s ease-in-out infinite; }

  .tile:hover .art { transform: scale(1.06); }

  @keyframes icon-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-9px) rotate(5deg); }
  }

  @keyframes icon-fly {
    0%   { transform: translate(-16px, 12px) rotate(-14deg); }
    50%  { transform: translate(16px, -14px) rotate(10deg); }
    100% { transform: translate(-16px, 12px) rotate(-14deg); }
  }

  @keyframes icon-wobble {
    0%, 100% { transform: rotate(-15deg) scale(1); }
    50%      { transform: rotate(15deg) scale(1.07); }
  }

  @keyframes icon-roll {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .tile .info {
    position: relative;
    padding: 16px 18px 20px;
    background: #fff;
    z-index: 2;
  }

  .tile .info::before {
    content: "";
    position: absolute;
    left: 16px; right: 16px; top: 0;
    border-top: 2px dashed rgba(27,27,27,.25);
  }

  .tile .info h2 {
    font-family: "Caveat", cursive;
    font-size: 1.55rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
  }

  .tile:hover .info h2,
  .tile:focus-visible .info h2 {
    text-decoration: underline wavy var(--red);
    text-underline-offset: 5px;
    text-decoration-thickness: 2px;
  }

  .tile .info p {
    margin-top: 3px;
    font-family: "Patrick Hand", cursive;
    font-size: 1rem;
    color: #6b6b6b;
  }

  .tile .arrow {
    position: absolute;
    bottom: 14px; right: 16px;
    z-index: 3;
    font-family: "Press Start 2P", monospace;
    font-size: .8rem;
    padding: 7px 8px;
    background: var(--yellow);
    border: 2.5px solid var(--ink);
    border-radius: 40% 60% 55% 45%;
    box-shadow: 3px 3px 0 var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: .2s ease;
  }

  .tile:hover .arrow, .tile:focus-visible .arrow {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .tile .art span { animation: none !important; }
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fit, minmax(150px, 190px)); gap: 30px 20px; }
    body { padding: 30px 14px 50px; }
    header p { font-size: 1.05rem; }
    .tile .info h2 { font-size: 1.2rem; }
    .tile .info p { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>ΣΥΛΛΟΓΗ<br>ΕΦΑΡΜΟΓΩΝ</h1>
  <p>Μικρές εφαρμογές για την καθημερινότητα</p>
</header>

<main class="grid" id="apps"></main>



<script>
  /* ============================================================
     ΠΡΟΣΘΕΣΕ ΕΔΩ ΤΙΣ ΕΦΑΡΜΟΓΕΣ ΣΟΥ
     - title  : όνομα εφαρμογής
     - desc   : σύντομη περιγραφή
     - url    : το link της εφαρμογής
     - icon   : emoji ή σύμβολο της εφαρμογής
     - color  : χρώμα του "σκετς" τετραγώνου
     ============================================================ */
  const APPS = [
    { title: "Ryanair Flight Planner", desc: "Ο σχεδιασμός των ταξιδιών αλλιώς!", url: "https://djgortsilas-lgtm.github.io/RyanairFlightPlanner", icon: "✈️", color: "#bde0fe" },
    { title: "Thess Cinema", desc: "Προβολές ταινιών στην Θεσσαλονίη", url: "https://djgortsilas-lgtm.github.io/ThessCinema", icon: "🎬", color: "#ffcad4" },
    { title: "Thess Food", desc: "Φαγητό, καφές και ποτό στη Θεσσαλονίκη", url: "https://djgortsilas-lgtm.github.io/ThessFood/", icon: "🍽️", color: "#fff3b0" },
    { title: "Good News", desc: "Καλές ειδήσεις από όλο τον κόσμο", url: "https://djgortsilas-lgtm.github.io/goodnews", icon: "🌍", color: "#ffd6a5" },
    { title: "Travel Cost", desc: "Υπολογισμός κόστους οδικών ταξιδιών", url: "https://djgortsilas-lgtm.github.io/travelcost/", icon: "🚗", color: "#c7f0d8" }
  ];

  const root = document.getElementById("apps");

  APPS.forEach(app => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = app.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `
      <div class="art" style="--tile-bg:${app.color}"><span>${app.icon}</span></div>
      <div class="info">
        <h2>${app.title}</h2>
        <p>${app.desc || ""}</p>
      </div>
      <div class="arrow">GO ↗</div>`;
    root.appendChild(a);
  });

</script>

</body>
</html>
